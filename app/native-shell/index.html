<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f14" />
  <meta name="color-scheme" content="dark" />
  <title>MicroLab Studio</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #0b0f14; color: #f4f6f8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 520px); text-align: center; }
    .mark { display: grid; place-items: center; width: 68px; height: 68px; margin: 0 auto 22px; border: 1px solid #35404c; border-radius: 20px; background: #141c25; font-size: 30px; }
    h1 { margin: 0; font-size: clamp(26px, 7vw, 38px); letter-spacing: -.04em; }
    p { color: #aab5c2; line-height: 1.65; margin: 14px auto 0; max-width: 420px; }
    .status { margin-top: 28px; padding: 14px 16px; border: 1px solid #343d49; border-radius: 14px; background: #111820; font-size: 14px; color: #d4dce5; }
    a { display: inline-block; margin-top: 20px; color: #9ed7ff; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">⌘</div>
    <h1>MicroLab Studio</h1>
    <p>Your cross-platform maker workspace for electronics, coding, and interactive 3D robotics builds.</p>
    <div class="status" role="status" id="status">This app needs its public production endpoint to be configured before it can connect.</div>
    <a id="retry" hidden href="">Open MicroLab Studio</a>
  </main>
  <script src="app-config.js"></script>
  <script>
    (() => {
      const url = window.MICROLAB_PUBLIC_URL;
      const status = document.getElementById('status');
      const retry = document.getElementById('retry');
      if (!url) return;
      try {
        const target = new URL(url);
        if (target.protocol !== 'https:') throw new Error('HTTPS required');
        status.textContent = 'Connecting to MicroLab Studio…';
        retry.href = target.href;
        retry.hidden = false;
        window.location.replace(target.href);
      } catch (_) {
        status.textContent = 'The app endpoint is invalid. Configure a public HTTPS URL to continue.';
      }
    })();
  </script>
</body>
</html>
