name: Standalone website checks

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate template
    # The app project lives in app/ (ci/ holds the deploy config, AGENTS.md +
    # skills/ stay at root). Every build step runs there.
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint (non-blocking for deployment)
        run: bun run lint
        continue-on-error: true

      - name: Test
        run: bun run test

      # Validate the website build. The hosted website is static and does not
      # require a Cloudflare Worker or native app build.
      - name: Build (design inspector on, as deploys ship it)
        env:
          HF_DESIGN_INSPECTOR: "1"
        run: bun run build
